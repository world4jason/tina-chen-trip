<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f5f55">
  <title>旅行行程助手</title>
  <style>
    :root{--bg:#f5f7f5;--surface:#fff;--text:#18211f;--muted:#62706d;--brand:#0f5f55;--soft:#e5f3ef;--warn:#a54809;--warnsoft:#fff1df;--danger:#a12828;--dangersoft:#fdeaea;--line:#dfe6e3}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:19px;line-height:1.55}
    .hidden{display:none!important}.app-shell{width:min(100%,760px);margin:auto;padding:20px 14px 110px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.eyebrow{color:var(--brand);font-weight:800;font-size:15px}h1{margin:2px 0 0;font-size:34px;line-height:1.15}h2{font-size:24px;margin:0}.view{display:none}.view.active{display:block}
    .hero-card,.event-card,.next-event-card,.notice-card,.check-section,.empty-card,.stay-card,.must-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 28px rgba(26,54,48,.08)}.hero-card{padding:21px;margin-bottom:24px}.hero-date{color:var(--brand);font-weight:800}.hero-title{font-size:30px;font-weight:900;line-height:1.2}.hero-sub,.day-header-sub,.check-note{color:var(--muted)}
    .section-heading{display:flex;justify-content:space-between;align-items:end;margin:22px 2px 12px}.section-heading span{font-size:14px;color:var(--muted)}.event-card{padding:18px;margin-bottom:12px}.event-card.important{border:2px solid var(--warn);background:var(--warnsoft)}.event-card.danger{border:2px solid var(--danger);background:var(--dangersoft)}.event-top{display:flex;gap:12px}.event-time{min-width:74px;font-size:22px;font-weight:900;color:var(--brand);line-height:1.15}.event-content{flex:1;min-width:0}.event-title{font-size:22px;font-weight:900;line-height:1.25}.event-route{margin-top:7px;font-weight:760}.event-detail{margin-top:7px;color:#44514e;white-space:pre-line}
    .tag-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.tag{padding:4px 9px;border-radius:999px;background:var(--soft);color:var(--brand);font-size:14px;font-weight:800}.tag.warning{background:#ffe1bd;color:#843906}.map-link{display:inline-block;margin-top:12px;padding:10px 13px;border-radius:12px;background:var(--brand);color:#fff;text-decoration:none;font-weight:800}.next-event-card{padding:17px 18px;margin-top:16px;border-left:6px solid var(--brand)}.next-label{color:var(--muted);font-size:15px;font-weight:800}.next-title{font-size:21px;font-weight:900}
    .must-card{margin-top:24px;padding:18px}.must-item{display:flex;gap:11px;padding:10px 0;border-top:1px solid var(--line)}.must-symbol{color:var(--warn);font-weight:900}.date-switcher{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:16px}.date-switcher button{min-height:48px;border:1px solid var(--line);border-radius:14px;background:#fff;font-weight:750;font-size:16px}.day-header{padding:10px 2px 12px}.day-header-date{color:var(--brand);font-weight:850}.day-header-title{font-size:29px;font-weight:900}.stay-card{padding:15px 18px;margin:8px 0 18px}.stay-label{color:var(--muted);font-size:15px;font-weight:800}.stay-name{font-size:20px;font-weight:900;overflow-wrap:anywhere}
    .notice-card{padding:16px 18px;margin-bottom:18px;background:var(--soft)}.notice-card strong,.notice-card span{display:block}.check-section{overflow:hidden;margin-bottom:16px}.check-section h2{padding:18px 18px 12px}.check-row{display:flex;gap:13px;padding:15px 18px;border-top:1px solid var(--line)}.check-row input{width:27px;height:27px;accent-color:var(--brand)}.check-row label{flex:1;font-weight:690}.check-row.checked label{text-decoration:line-through;color:var(--muted)}.check-note{display:block;font-size:15px;font-weight:500;margin-top:4px}.check-row.alert{background:var(--dangersoft)}.empty-card{padding:22px;text-align:center;color:var(--muted)}.empty-card strong{display:block;color:var(--text);font-size:21px}
    .bottom-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,760px);display:grid;grid-template-columns:repeat(3,1fr);padding:9px 10px calc(9px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:1px solid var(--line);backdrop-filter:blur(12px)}.nav-button{min-height:62px;border:0;border-radius:16px;background:transparent;color:var(--muted);font-weight:850;font-size:17px}.nav-button.active{background:var(--soft);color:var(--brand)}
    @media(max-width:420px){body{font-size:18px}.event-time{min-width:66px;font-size:20px}.event-title{font-size:21px}.hero-title{font-size:28px}}
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar"><div><div class="eyebrow">冰島・荷蘭・奧捷</div><h1 id="pageTitle">今天要做什麼</h1></div><button id="installButton" class="hidden" type="button">加到桌面</button></header>
    <section id="nowView" class="view active"><div id="todaySummary"></div><div class="section-heading"><h2>現在附近的行程</h2><span>前 1 小時～後 2 小時</span></div><div id="nowCards"></div><div id="nextCard"></div><div id="todayMustDo"></div></section>
    <section id="daysView" class="view"><div class="date-switcher"><button id="prevDay">‹ 前一天</button><button id="todayDay">今天</button><button id="nextDay">後一天 ›</button></div><div id="dayHeader"></div><div id="dayTimeline"></div></section>
    <section id="checkView" class="view"><div class="notice-card"><strong>打勾會自動保存在這支手機。</strong><span>重新開網頁也會保留。</span></div><div id="checklist"></div></section>
  </main>
  <nav class="bottom-nav"><button id="nowTab" class="nav-button active" data-view="nowView">現在</button><button id="daysTab" class="nav-button" data-view="daysView">每天</button><button id="checkTab" class="nav-button" data-view="checkView">Checklist</button></nav>

  <!-- 使用相對路徑，讓 GitHub Pages 的 /tina-chen-trip/ 子路徑可以直接運作 -->
  <script src="./trip-base.js"></script>
  <script src="./trip-days-1.js"></script>
  <script src="./trip-days-2.js"></script>
  <script src="./trip-days-3.js"></script>
  <script src="./trip-days-4.js"></script>
  <script src="./trip-days-5.js"></script>
  <script src="./trip-days-6.js"></script>
  <script src="./trip-days-7.js"></script>
  <script src="./paper-schedule.js"></script>
  <script src="./app.js"></script>
</body>
</html>
